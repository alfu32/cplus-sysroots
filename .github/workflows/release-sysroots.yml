name: Build and release sysroots

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to release, or a new tag name to create
        required: true
        type: string
      publish:
        description: Publish the generated ZIP assets to the tag release
        required: true
        default: false
        type: boolean
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: sysroot-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  catalog:
    name: Validate catalog
    runs-on: ubuntu-24.04
    outputs:
      references: ${{ steps.catalog.outputs.references }}
      tag: ${{ steps.tag.outputs.tag }}
      publish: ${{ steps.publish.outputs.publish }}
    steps:
      - uses: actions/checkout@v4

      - name: Validate triples and README entries
        run: ./scripts/validate-catalog.sh

      - id: catalog
        name: Build Linux and Windows matrix
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import os

          references = []
          for raw in open("triples.txt", encoding="utf-8"):
              reference = raw.strip()
              if reference and not reference.startswith("#") and "-apple-darwin-" not in reference:
                  references.append(reference)

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write("references=" + json.dumps(references, separators=(",", ":")) + "\n")
          PY

      - id: tag
        name: Select release tag
        shell: bash
        env:
          INPUT_TAG: ${{ inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          tag="${INPUT_TAG:-$REF_NAME}"
          case "$tag" in
            v*) ;;
            *) echo "Release tag must start with v: $tag" >&2; exit 1 ;;
          esac
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - id: publish
        name: Select publication mode
        shell: bash
        env:
          INPUT_PUBLISH: ${{ inputs.publish }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [[ "$EVENT_NAME" == "push" ]]; then
            echo 'publish=true' >> "$GITHUB_OUTPUT"
          else
            echo "publish=${INPUT_PUBLISH:-false}" >> "$GITHUB_OUTPUT"
          fi

  package:
    name: Package ${{ matrix.reference }}
    needs: catalog
    if: needs.catalog.outputs.references != '[]'
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        reference: ${{ fromJSON(needs.catalog.outputs.references) }}
    steps:
      - uses: actions/checkout@v4

      - name: Require staged sysroot
        shell: bash
        env:
          REFERENCE: ${{ matrix.reference }}
        run: |
          source_dir="staging/$REFERENCE"
          if [[ ! -d "$source_dir" ]]; then
            echo "No staged sysroot exists at $source_dir." >&2
            echo "A target builder must populate staging/<reference> before packaging." >&2
            exit 1
          fi
          ./scripts/package-sysroot.sh "$REFERENCE" "$source_dir" dist

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: sysroot-${{ matrix.reference }}
          path: dist/${{ matrix.reference }}.*
          if-no-files-found: error
          retention-days: 7

  release:
    name: Publish release assets
    needs: [catalog, package]
    if: needs.catalog.outputs.publish == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Download packages
        uses: actions/download-artifact@v4
        with:
          pattern: sysroot-*
          path: dist
          merge-multiple: true

      - name: Create or update release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.catalog.outputs.tag }}
        run: |
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --title "$TAG" --generate-notes
          fi
          gh release upload "$TAG" dist/*.zip dist/*.sha256 dist/*.json --clobber
