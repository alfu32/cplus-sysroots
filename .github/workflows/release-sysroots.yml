name: Build and release sysroots

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to release, or a new tag name to create
        required: true
        type: string
      publish:
        description: Publish generated ZIP assets to the tag release
        required: true
        default: false
        type: boolean
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: sysroot-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  catalog:
    name: Validate catalog
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      tag: ${{ steps.tag.outputs.tag }}
      publish: ${{ steps.publish.outputs.publish }}
    steps:
      - uses: actions/checkout@v4

      - name: Validate catalog and README
        run: ./scripts/validate-catalog.sh

      - id: matrix
        name: Build target matrix
        run: echo "matrix=$(python3 scripts/catalog.py buildable)" >> "$GITHUB_OUTPUT"

      - id: tag
        name: Select release tag
        env:
          INPUT_TAG: ${{ inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          tag="${INPUT_TAG:-$REF_NAME}"
          case "$tag" in
            v*) ;;
            *) echo "Release tag must start with v: $tag" >&2; exit 1 ;;
          esac
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - id: publish
        name: Select publication mode
        env:
          INPUT_PUBLISH: ${{ inputs.publish }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [[ "$EVENT_NAME" == push ]]; then
            echo 'publish=true' >> "$GITHUB_OUTPUT"
          else
            echo "publish=${INPUT_PUBLISH:-false}" >> "$GITHUB_OUTPUT"
          fi

  build:
    name: Build ${{ matrix.reference }}
    needs: catalog
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.catalog.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - name: Enable foreign-architecture containers
        if: matrix.family != 'mingw-ucrt'
        uses: docker/setup-qemu-action@v3

      - name: Stage Linux sysroot from base image
        if: matrix.family != 'mingw-ucrt'
        env:
          REFERENCE: ${{ matrix.reference }}
        run: ./scripts/stage-sysroot.sh "$REFERENCE" "staging/$REFERENCE"

      - name: Stage Windows UCRT sysroot from MSYS2
        if: matrix.family == 'mingw-ucrt'
        shell: pwsh
        env:
          REFERENCE: ${{ matrix.reference }}
        run: ./scripts/stage-windows.ps1 -Reference "$env:REFERENCE" -Output "staging/$env:REFERENCE"

      - name: Validate staged sysroot
        shell: bash
        env:
          REFERENCE: ${{ matrix.reference }}
        run: ./scripts/validate-staged.sh "$REFERENCE" "staging/$REFERENCE"

      - name: Package sysroot
        shell: bash
        env:
          REFERENCE: ${{ matrix.reference }}
        run: ./scripts/package-sysroot.sh "$REFERENCE" "staging/$REFERENCE" dist

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: sysroot-${{ matrix.reference }}
          path: dist/${{ matrix.reference }}.*
          if-no-files-found: error
          retention-days: 7

  darwin-gate:
    name: Report blocked Darwin targets
    needs: catalog
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Explain Darwin gate
        run: |
          echo 'Darwin targets are intentionally excluded from release builds.'
          echo 'Apple SDK redistribution rights are unresolved.'
          python3 scripts/catalog.py darwin

  release:
    name: Publish release assets
    needs: [catalog, build, darwin-gate]
    if: needs.catalog.outputs.publish == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Download packages
        uses: actions/download-artifact@v4
        with:
          pattern: sysroot-*
          path: dist
          merge-multiple: true

      - name: Build catalog release asset
        run: |
          python3 scripts/export-catalog.py dist/sysroots-catalog.json
          cp triples.txt dist/triples.txt
          cp README.md dist/README.md
          (
            cd dist
            zip -q sysroots-catalog.zip triples.txt README.md sysroots-catalog.json
          )

      - name: Create or update release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.catalog.outputs.tag }}
        run: |
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --title "$TAG" --generate-notes
          fi
          gh release upload "$TAG" dist/*.zip dist/*.sha256 dist/*.json dist/triples.txt dist/README.md --clobber
